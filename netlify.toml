[build]
  command = "node scripts/build-ai-index.mjs"
  publish = "."
  functions = "netlify/functions"

# Custom 404 page (Netlify serves 404.html automatically)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Long-cache static assets (hashed filenames are not used, so keep this moderate)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JSON data endpoints must revalidate quickly — they carry live video
# statistics and the AI index. (Placed after /assets/* so this wins there.)
[[headers]]
  for = "/assets/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The admin panel must never be indexed and must not be cached
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The runtime article shell (/article, /article.html) is a renderer, not a
# page — never index it. NOTE: this must NOT cover /article/* subpaths, thin
# draft pages there carry their own meta robots, and approved articles become
# real static files that must stay indexable.
[[headers]]
  for = "/article"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/article.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Clean article URLs served by the public CMS
[[redirects]]
  from = "/article"
  to = "/article.html"
  status = 200

# Live video data — server-side YouTube feed (videos-fresh function)
[[redirects]]
  from = "/api/videos"
  to = "/.netlify/functions/videos-fresh"
  status = 200

[[redirects]]
  from = "/article/*"
  to = "/article.html?slug=:splat"
  status = 200

# Handy admin entry points
[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin/dashboard"
  to = "/admin/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/editor"
  to = "/admin/editor.html"
  status = 200
