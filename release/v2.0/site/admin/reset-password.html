<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset password | AH Solution Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-wrap">
    <section class="card login-card">
      <a class="brand" href="login.html" style="margin-bottom:22px">
        <span class="brand-mark">AH<span>.</span></span>
        <span class="brand-copy"><span class="brand-name">AH SOLUTION</span><span class="brand-sub">Content admin</span></span>
      </a>
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your administrator account.</p>
      <div class="notice" data-notice role="status" aria-live="polite" hidden></div>
      <form class="stack" data-reset-form novalidate hidden>
        <label>New password
          <input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
        </label>
        <label>Confirm new password
          <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required placeholder="Enter it again">
        </label>
        <button class="btn btn--primary" type="submit">Update password</button>
      </form>
      <div class="stack" data-retry hidden>
        <p class="hint">The recovery link is missing, invalid, or expired. Request a fresh email to continue.</p>
        <label>Email address
          <input type="email" data-email autocomplete="email" required placeholder="admin@example.com">
        </label>
        <button class="btn btn--primary" type="button" data-send>Send a new reset link</button>
      </div>
      <p class="login-foot"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="admin.js"></script>
  <script>
    (function () {
      'use strict';
      var A = window.AHAdmin;
      var params = new URLSearchParams(location.search);
      var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      var token = hash.get('access_token') || params.get('access_token') || params.get('jwt') || '';
      var type = hash.get('type') || params.get('type') || '';
      var code = params.get('code') || '';
      var emailFromUrl = params.get('email') || '';
      var form = document.querySelector('[data-reset-form]');
      var retry = document.querySelector('[data-retry]');
      var notice = document.querySelector('[data-notice]');
      var email = document.querySelector('[data-email]');
      var sendBtn = document.querySelector('[data-send]');
      var password = form.elements.password;
      var confirm = form.elements.confirm_password;

      function showNotice(kind, text) {
        notice.className = 'notice notice--' + kind;
        notice.textContent = text;
        notice.hidden = !text;
      }
      function showRetry(message) {
        form.hidden = true;
        retry.hidden = false;
        showNotice('error', message || 'This reset link is invalid or has expired.');
      }

      // Supabase commonly returns recovery tokens in the URL fragment, not ?jwt=...
      if (token && (!type || type === 'recovery')) {
        form.hidden = false;
        retry.hidden = true;
        showNotice('ok', '');
      } else {
        showRetry(code
          ? 'This link uses a one-time authorization code. The deployed admin-auth function must exchange that code before password update can work.'
          : 'The reset link is missing, invalid, or expired. Request a new reset email.');
        if (emailFromUrl) email.value = emailFromUrl;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (password.value.length < 8) {
          showNotice('error', 'Use at least 8 characters for your password.');
          password.focus();
          return;
        }
        if (password.value !== confirm.value) {
          showNotice('error', 'The passwords do not match.');
          confirm.focus();
          return;
        }
        var btn = form.querySelector('[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Updating…';
        showNotice('ok', '');
        fetch('/.netlify/functions/admin-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'update_password',
            access_token: token,
            jwt: token,
            password: password.value,
            type: type || 'recovery'
          })
        }).then(function (r) {
          return r.text().then(function (text) {
            var data;
            try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {}; }
            if (!r.ok || !data.ok) {
              var err = new Error(data.error || 'password_update_failed');
              err.status = r.status;
              throw err;
            }
            showNotice('ok', 'Password updated. You can now sign in.');
            form.reset();
            setTimeout(function () { location.replace('login.html?password_updated=1'); }, 1400);
          });
        }).catch(function (err) {
          if (err.status === 410 || /expired|otp|invalid.*token/i.test(err.message)) {
            showRetry('This reset link has expired or was already used. Request a new reset email.');
          } else {
            showNotice('error', 'Could not update the password: ' + err.message + '. The admin-auth function must support action=update_password with an access_token.');
          }
        }).finally(function () {
          btn.disabled = false;
          btn.textContent = 'Update password';
        });
      });

      sendBtn.addEventListener('click', function () {
        var address = email.value.trim();
        if (!address) { showNotice('error', 'Enter your admin email address.'); email.focus(); return; }
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending…';
        fetch('/.netlify/functions/admin-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send_password_reset', email: address })
        }).then(function (r) {
          return r.text().then(function (text) {
            var data;
            try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {}; }
            if (!r.ok || !data.ok) throw new Error(data.error || 'reset_request_failed');
            showNotice('ok', 'If this email belongs to an admin account, a reset link will be sent. Check your inbox and spam folder.');
          });
        }).catch(function (err) {
          showNotice('error', 'Could not send reset email: ' + err.message);
        }).finally(function () {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send a new reset link';
        });
      });
    })();
  </script>
</body>
</html>
