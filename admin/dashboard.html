<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Dashboard | AH Solution Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html">
        <span class="brand-mark">AH<span>.</span></span>
        <span class="brand-copy">
          <span class="brand-name">AH SOLUTION</span>
          <span class="brand-sub">Content admin</span>
        </span>
      </a>
      <div class="topbar-right">
        <span class="who" data-who>…</span>
        <a class="btn btn--sm" href="editor.html">New article</a>
        <button class="btn btn--sm btn--ghost" type="button" data-logout>Sign out</button>
      </div>
    </header>

    <div class="notice" data-notice hidden style="margin-bottom:18px"></div>

    <section class="stats" data-stats hidden>
      <div class="stat"><div class="stat__k">Total</div><div class="stat__v" data-stat="total">0</div></div>
      <div class="stat stat--published"><div class="stat__k">Published</div><div class="stat__v" data-stat="published">0</div></div>
      <div class="stat stat--drafts"><div class="stat__k">Drafts</div><div class="stat__v" data-stat="draft">0</div></div>
      <div class="stat"><div class="stat__k">Archived</div><div class="stat__v" data-stat="archived">0</div></div>
      <div class="stat"><div class="stat__k">Total views</div><div class="stat__v" data-stat="views">0</div></div>
    </section>

    <section class="card" style="margin-bottom:22px">
      <div class="grid-2" style="align-items:end">
        <label>
          Search
          <input type="search" data-search placeholder="Title, slug or category…">
        </label>
        <label>
          Status
          <select data-status>
            <option value="">All statuses</option>
            <option value="published">Published</option>
            <option value="draft">Drafts</option>
            <option value="archived">Archived</option>
          </select>
        </label>
      </div>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Article</th>
            <th>Status</th>
            <th>Category</th>
            <th>Published</th>
            <th>Views</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody data-rows>
          <tr><td colspan="6" class="empty">Loading articles…</td></tr>
        </tbody>
      </table>
    </div>

    <p class="hint" style="margin-top:14px" data-count></p>
  </div>

  <script src="admin.js"></script>
  <script>
    (function () {
      var A = window.AHAdmin;
      var session = A.requireAuth();
      if (!session) return;

      var rowsEl = A.$('[data-rows]');
      var noticeEl = A.$('[data-notice]');
      var searchEl = A.$('[data-search]');
      var statusEl = A.$('[data-status]');
      var countEl = A.$('[data-count]');
      var whoEl = A.$('[data-who]');
      var statsEl = A.$('[data-stats]');
      var all = [];

      if (session.user && session.user.email) whoEl.textContent = session.user.email;

      A.$('[data-logout]').addEventListener('click', function () { A.logout(); });

      function statusBadge(status) {
        return '<span class="status status--' + A.esc(status) + '"><span class="dot"></span>' + A.esc(status) + '</span>';
      }

      function renderStats() {
        if (!statsEl) return;
        var counts = { published: 0, draft: 0, archived: 0 };
        var views = 0;
        all.forEach(function (a) {
          counts[a.status] = (counts[a.status] || 0) + 1;
          views += Number(a.view_count) || 0;
        });
        statsEl.hidden = false;
        statsEl.querySelector('[data-stat="total"]').textContent = String(all.length);
        Object.keys(counts).forEach(function (k) {
          var el = statsEl.querySelector('[data-stat="' + k + '"]');
          if (el) el.textContent = String(counts[k]);
        });
        var viewsEl = statsEl.querySelector('[data-stat="views"]');
        if (viewsEl) viewsEl.textContent = views.toLocaleString();
      }

      function render() {
        var q = (searchEl.value || '').trim().toLowerCase();
        var st = statusEl.value;
        var list = all.filter(function (a) {
          if (st && a.status !== st) return false;
          if (!q) return true;
          return (String(a.title || '') + ' ' + String(a.slug || '') + ' ' + String(a.category || '')).toLowerCase().indexOf(q) !== -1;
        });

        if (!list.length) {
          rowsEl.innerHTML = '<tr><td colspan="6" class="empty">No articles found. Create your first article or adjust the filters.</td></tr>';
          countEl.textContent = all.length ? 'No matches for the current filter.' : '';
          return;
        }

        rowsEl.innerHTML = list.map(function (a) {
          return '<tr data-id="' + A.esc(a.id) + '">' +
            '<td><div class="title-cell">' +
              '<a href="editor.html?id=' + encodeURIComponent(a.id) + '">' + A.esc(a.title) + '</a>' +
              '<span class="slug">/' + A.esc(a.slug) + '</span>' +
            '</div></td>' +
            '<td>' + statusBadge(a.status) + '</td>' +
            '<td>' + (a.category ? A.esc(a.category) : '<span class="hint">—</span>') + '</td>' +
            '<td>' + A.fmtDate(a.published_at || a.created_at) + '</td>' +
            '<td>' + (a.view_count || 0) + '</td>' +
            '<td><div class="actions">' +
              '<a class="btn btn--sm" href="editor.html?id=' + encodeURIComponent(a.id) + '">Edit</a>' +
              (a.status === 'published'
                ? '<button class="btn btn--sm" type="button" data-act="unpublish">Unpublish</button>'
                : '<button class="btn btn--sm btn--primary" type="button" data-act="publish">Publish</button>') +
              (a.status === 'published' && a.slug
                ? '<a class="btn btn--sm" href="../article.html?slug=' + encodeURIComponent(a.slug) + '" target="_blank" rel="noopener">View</a>'
                : '') +
              '<button class="btn btn--sm btn--danger" type="button" data-act="delete">Delete</button>' +
            '</div></td>' +
          '</tr>';
        }).join('');

        countEl.textContent = list.length + ' of ' + all.length + ' articles';
      }

      function load() {
        A.articles.list({ limit: 100 }).then(function (res) {
          if (!res.body || !res.body.ok) throw new Error((res.body && res.body.error) || 'load_failed');
          all = res.body.articles || [];
          render();
          renderStats();
          A.notice(noticeEl, 'ok', '');
        }).catch(function (err) {
          if (err.message === 'auth_required' || err.code === 'auth_required') { location.replace('login.html'); return; }
          rowsEl.innerHTML = '<tr><td colspan="6" class="empty">Could not load articles (' + A.esc(err.message) + ').</td></tr>';
          A.notice(noticeEl, 'error', 'Could not load articles. Check that the CMS functions are deployed.');
        });
      }

      rowsEl.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]');
        if (!btn) return;
        var id = btn.closest('tr').dataset.id;
        var act = btn.dataset.act;
        btn.disabled = true;

        var job = act === 'delete'
          ? (window.confirm('Delete this article permanently? This cannot be undone.')
              ? A.articles.remove(id)
              : Promise.resolve(null))
          : act === 'publish' ? A.articles.publish(id) : A.articles.unpublish(id);

        Promise.resolve(job).then(function (res) {
          if (!res) return;
          if (!res.body || !res.body.ok) throw new Error((res.body && res.body.error) || 'failed');
          A.notice(noticeEl, 'ok', act === 'delete' ? 'Article deleted.' : (act === 'unpublish' ? 'Article unpublished.' : 'Article published.'));
          load();
        }).catch(function (err) {
          btn.disabled = false;
          A.notice(noticeEl, 'error', 'Action failed: ' + err.message);
        });
      });

      searchEl.addEventListener('input', A.debounce(render, 160));
      statusEl.addEventListener('change', render);

      load();
    })();
  </script>
</body>
</html>
