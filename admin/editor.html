<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Editor | AH Solution Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="dashboard.html">
        <span class="brand-mark">AH<span>.</span></span>
        <span class="brand-copy">
          <span class="brand-name">AH SOLUTION</span>
          <span class="brand-sub">Article editor</span>
        </span>
      </a>
      <div class="topbar-right">
        <a class="btn btn--sm btn--ghost" href="dashboard.html">← Dashboard</a>
        <button class="btn btn--sm" type="button" data-save-draft>Save draft</button>
        <button class="btn btn--sm btn--primary" type="button" data-publish>Publish</button>
      </div>
    </header>

    <div class="notice" data-notice hidden style="margin-bottom:18px"></div>

    <form data-editor-form novalidate>
      <div class="editor-grid">
        <div class="stack">
          <label>
            Title
            <input type="text" name="title" data-title maxlength="200" placeholder="A clear, specific title" required>
          </label>

          <label>
            Slug
            <input type="text" name="slug" data-slug maxlength="100" placeholder="auto-generated-from-title" pattern="[a-z0-9-]*">
            <span class="hint">Lowercase letters, numbers and hyphens. Leave blank to generate from the title.</span>
          </label>

          <div>
            <div class="editor-mode-toggle" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
              <button type="button" class="btn btn--sm btn--primary" data-mode="richtext" aria-pressed="true">Rich Text</button>
              <button type="button" class="btn btn--sm btn--ghost" data-mode="markdown" aria-pressed="false">Markdown</button>
              <button type="button" class="btn btn--sm btn--ghost" data-import>Import document</button>
              <input type="file" data-import-file accept=".md,.html,.docx,.pdf" hidden>
            </div>
            <div class="toolbar" role="toolbar" aria-label="Text formatting" data-toolbar>
              <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
              <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
              <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
              <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
              <span class="sep" aria-hidden="true"></span>
              <button type="button" data-block="h2" title="Heading">H2</button>
              <button type="button" data-block="h3" title="Subheading">H3</button>
              <button type="button" data-block="p" title="Paragraph">¶</button>
              <span class="sep" aria-hidden="true"></span>
              <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
              <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
              <button type="button" data-block="blockquote" title="Quote">❝</button>
              <button type="button" data-cmd="code" title="Inline code">&lt;/&gt;</button>
              <span class="sep" aria-hidden="true"></span>
              <button type="button" data-link title="Insert link">Link</button>
              <button type="button" data-image title="Insert image">Image</button>
              <span class="sep" aria-hidden="true"></span>
              <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
              <button type="button" data-cmd="undo" title="Undo">↶</button>
              <button type="button" data-cmd="redo" title="Redo">↷</button>
            </div>
            <div class="rich" contenteditable="true" data-body role="textbox" aria-multiline="true"
                 aria-label="Article body" data-placeholder="Write the article body�?�"></div>
            <textarea class="markdown-editor" data-markdown hidden rows="20"
                      style="width:100%;min-height:400px;font-family:monospace;font-size:13px;padding:12px;background:rgba(8,8,11,.6);color:var(--c-text);border:1px solid var(--c-line);border-radius:12px;resize:vertical"
                      aria-label="Markdown source" placeholder="# Heading\n\nWrite Markdown here..."></textarea>
            <div class="markdown-preview" data-md-preview hidden
                 style="min-height:400px;padding:12px;border:1px solid var(--c-line);border-radius:12px;background:rgba(8,8,11,.4);overflow:auto"></div>
          </div>
        </div>

        <aside class="stack">
          <section class="card side-card">
            <h2>Publishing</h2>
            <label>
              Status
              <select name="status" data-status>
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                <option value="archived">Archived</option>
              </select>
            </label>
            <p class="hint" data-meta>Not saved yet.</p>
          </section>

          <section class="card side-card">
            <h2>Details</h2>
            <label>
              Excerpt
              <textarea name="excerpt" data-excerpt maxlength="400" rows="3" placeholder="One or two sentences shown in listings"></textarea>
            </label>
            <label>
              Category
              <div class="chip-row" data-chips>
                <button class="chip" type="button" data-category="Android">Android</button>
                <button class="chip" type="button" data-category="PC &amp; Windows">PC &amp; Windows</button>
                <button class="chip" type="button" data-category="Apps">Apps</button>
                <button class="chip" type="button" data-category="Gadgets">Gadgets</button>
                <button class="chip" type="button" data-category="Guides">Guides</button>
              </div>
            </label>
            <label>
              Tags
              <input type="text" name="tags" data-tags maxlength="200" placeholder="smartwatch, buying guide">
            </label>
          </section>

          <section class="card side-card">
            <h2>Cover image</h2>
            <img class="cover-preview" data-cover-preview alt="" data-empty="1">
            <input class="file-control" type="file" accept="image/jpeg,image/png,image/webp,image/avif" data-cover-file aria-label="Choose cover image">
            <label>
              Or image URL
              <input type="url" name="cover_image_url" data-cover-url placeholder="https://…">
            </label>
            <button class="btn btn--sm" type="button" data-cover-upload>Upload cover image</button>
            <p class="hint">Images are uploaded securely through the site backend. The returned URL is saved with this article.</p>
          </section>

          <section class="card side-card">
            <h2>Search preview</h2>
            <label>
              SEO description
              <textarea name="seo_description" data-seo maxlength="300" rows="3" placeholder="Shown in search results"></textarea>
            </label>
              <label>Schedule publish (UTC ISO)<input type="datetime-local" name="publish_at" step="60"></label>
              <label>NEW badge until<input type="datetime-local" name="new_until" step="60"></label>
            <div style="border:1px solid var(--c-line);border-radius:12px;padding:12px;background:rgba(8,8,11,.5)">
              <div style="color:#9ecbff;font-size:12.5px" data-seo-url>ahsolution.live/article</div>
              <div style="font-weight:700;margin-top:3px" data-seo-title>Article title</div>
              <div style="color:var(--c-muted);font-size:12.5px" data-seo-desc>Article description</div>
            </div>
          </section>
        </aside>
      </div>
    </form>
  </div>

  <script src="admin.js"></script>
  <script>
    (function () {
      var A = window.AHAdmin;
      if (!A.requireAuth()) return;

      var form = A.$('[data-editor-form]');
      var noticeEl = A.$('[data-notice]');
      var titleEl = A.$('[data-title]');
      var slugEl = A.$('[data-slug]');
      var bodyEl = A.$('[data-body]');
      var statusEl = A.$('[data-status]');
      var excerptEl = A.$('[data-excerpt]');
      var tagsEl = A.$('[data-tags]');
      var seoEl = A.$('[data-seo]');
      var metaEl = A.$('[data-meta]');
      var coverUrlEl = A.$('[data-cover-url]');
      var coverPreview = A.$('[data-cover-preview]');
      var category = '';
      var currentId = null;
      var slugTouched = false;
      var saving = false;

      /* ---------------- boot: existing article or new ---------------- */
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      if (id) {
        A.articles.list({ limit: 1 }).then(function () { /* warm the token */ })
          .catch(function () {});
        A.token().then(function (t) {
          return fetch('/.netlify/functions/articles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
            body: JSON.stringify({ action: 'list', limit: 100 })
          }).then(function (r) { return r.json(); });
        }).then(function (res) {
          var found = (res.articles || []).filter(function (a) { return a.id === id; })[0];
          if (!found) { A.notice(noticeEl, 'error', 'That article could not be found.'); return; }
          fill(found);
        }).catch(function (err) {
          A.notice(noticeEl, 'error', 'Could not load the article: ' + err.message);
        });
      }

      function fill(a) {
        currentId = a.id;
        titleEl.value = a.title || '';
        slugEl.value = a.slug || '';
        slugTouched = true;
        bodyEl.innerHTML = a.body || '';
        statusEl.value = a.status || 'draft';
        excerptEl.value = a.excerpt || '';
        tagsEl.value = Array.isArray(a.tags) ? a.tags.join(', ') : (a.tags || '');
        seoEl.value = a.seo_description || '';
        setCover(a.cover_image_url || '');
        setCategory(a.category || '');
        metaEl.textContent = 'Last updated ' + A.fmtDate(a.updated_at || a.created_at) +
          ' · ' + (a.reading_minutes || 1) + ' min read · ' + (a.view_count || 0) + ' views';
        updateSeo();
        document.title = 'Edit: ' + (a.title || 'Article') + ' | AH Solution Admin';
      }

      function setCover(url) {
        coverUrlEl.value = url || '';
        if (url) {
          coverPreview.src = url;
          coverPreview.removeAttribute('data-empty');
          coverPreview.onerror = function () {
            coverPreview.setAttribute('data-empty', '1');
            A.notice(noticeEl, 'error', 'The cover image URL could not be loaded. Check the URL or upload the image again.');
          };
          coverPreview.onload = function () { coverPreview.removeAttribute('data-empty'); };
        } else {
          coverPreview.removeAttribute('src');
          coverPreview.setAttribute('data-empty', '1');
        }
      }
      function setCategory(cat) {
        category = cat;
        A.$$('[data-chips] .chip').forEach(function (c) {
          c.setAttribute('aria-pressed', String(c.dataset.category === cat));
        });
      }
      A.$$('[data-chips] .chip').forEach(function (c) {
        c.addEventListener('click', function () {
          setCategory(category === c.dataset.category ? '' : c.dataset.category);
        });
      });

      /* ---------------- slug auto-generation ---------------- */
      function slugify(s) {
        return String(s || '').toLowerCase().trim()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 100);
      }
      titleEl.addEventListener('input', function () {
        if (!slugTouched) slugEl.value = slugify(titleEl.value);
        updateSeo();
      });
      slugEl.addEventListener('input', function () { slugTouched = true; slugEl.value = slugify(slugEl.value); updateSeo(); });

      /* ---------------- editor mode switching ---------------- */
      var mode = 'richtext';
      var mdEl = A.$('[data-markdown]');
      var mdPreview = A.$('[data-md-preview]');
      var richEl = bodyEl;

      function htmlToMarkdown(html) {
        var md = html
          .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n\n')
          .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n\n')
          .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n\n')
          .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '**$1**')
          .replace(/<b[^>]*>(.*?)<\/b>/gi, '**$1**')
          .replace(/<em[^>]*>(.*?)<\/em>/gi, '*$1*')
          .replace(/<i[^>]*>(.*?)<\/i>/gi, '*$1*')
          .replace(/<u[^>]*>(.*?)<\/u>/gi, '_$1_')
          .replace(/<code[^>]*>(.*?)<\/code>/gi, '`$1`')
          .replace(/<a[^>]*href="([^"]*)"[^>]*>(.*?)<\/a>/gi, '[$2]($1)')
          .replace(/<img[^>]*src="([^"]*)"[^>]*alt="([^"]*)"[^>]*>/gi, '![$2]($1)')
          .replace(/<img[^>]*src="([^"]*)"[^>]*>/gi, '![]($1)')
          .replace(/<li[^>]*>(.*?)<\/li>/gi, '- $1\n')
          .replace(/<ul[^>]*>(.*?)<\/ul>/gis, '$1\n')
          .replace(/<ol[^>]*>(.*?)<\/ol>/gis, '$1\n')
          .replace(/<blockquote[^>]*>(.*?)<\/blockquote>/gis, '> $1\n\n')
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<p[^>]*>(.*?)<\/p>/gis, '$1\n\n')
          .replace(/<hr[^>]*>/gi, '---\n\n')
          .replace(/<[^>]+>/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
        return md;
      }

      function markdownToHtml(md) {
        // SECURITY: escape all HTML in source first, then convert Markdown syntax.
        // This prevents script injection via Markdown content.
        var escaped = md
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
        var html = escaped
          .replace(/^### (.+)$/gm, '<h3>$1</h3>')
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/_(.+?)_/g, '<u>$1</u>')
          .replace(/`(.+?)`/g, '<code>$1</code>')
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (m, alt, url) {
            if (!/^https?:\/\//i.test(url)) return m; // reject non-http URLs
            return '<img src="' + url + '" alt="' + alt + '">';
          })
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, text, url) {
            if (!/^https?:\/\/|^mailto:/i.test(url)) return m; // reject unsafe URLs
            return '<a href="' + url + '">' + text + '</a>';
          })
          .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
          .replace(/^---$/gm, '<hr>')
          .replace(/^- (.+)$/gm, '<li>$1</li>')
          .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/^(.+)$/gm, function (m) { return m.startsWith('<') ? m : '<p>' + m + '</p>'; });
        // Wrap consecutive <li> in <ul>
        html = html.replace(/(<li>.*?<\/li>\n?)+/gs, function (m) { return '<ul>' + m + '</ul>'; });
        return html;
      }

      function renderMdPreview() {
        if (!mdPreview || mdPreview.hidden) return;
        mdPreview.innerHTML = markdownToHtml(mdEl.value);
      }

      function switchMode(newMode) {
        if (newMode === mode) return;
        if (newMode === 'markdown') {
          // Rich Text → Markdown
          mdEl.value = htmlToMarkdown(richEl.innerHTML);
          richEl.hidden = true;
          mdEl.hidden = false;
          mdPreview.hidden = false;
          renderMdPreview();
        } else {
          // Markdown → Rich Text
          richEl.innerHTML = markdownToHtml(mdEl.value);
          mdEl.hidden = true;
          mdPreview.hidden = true;
          richEl.hidden = false;
        }
        mode = newMode;
        // Update toggle buttons
        A.$$('[data-mode]').forEach(function (btn) {
          btn.classList.toggle('btn--primary', btn.dataset.mode === newMode);
          btn.classList.toggle('btn--ghost', btn.dataset.mode !== newMode);
          btn.setAttribute('aria-pressed', String(btn.dataset.mode === newMode));
        });
      }

      A.$$('[data-mode]').forEach(function (btn) {
        btn.addEventListener('click', function () { switchMode(btn.dataset.mode); });
      });

      if (mdEl) mdEl.addEventListener('input', A.debounce(renderMdPreview, 300));

      // Override collect() to use the correct body source
      var origCollect = collect;
      collect = function () {
        var data = origCollect();
        if (mode === 'markdown') {
          data.body = markdownToHtml(mdEl.value);
        } else {
          data.body = richEl.innerHTML;
        }
        return data;
      };

      // Override fill() to populate both editors
      var origFill = fill;
      fill = function (a) {
        origFill(a);
        if (mdEl) mdEl.value = htmlToMarkdown(a.body || '');
      };

      /* ---------------- document import ---------------- */
      var importBtn = A.$('[data-import]');
      var importFile = A.$('[data-import-file]');

      function importMarkdown(text) {
        // Convert Markdown to HTML and set in rich text editor
        var html = markdownToHtml(text);
        richEl.innerHTML = html;
        if (mdEl) mdEl.value = text;
        A.notice(noticeEl, 'ok', 'Markdown imported. Review and edit before saving.');
      }

      function importHtml(text) {
        // Parse HTML, sanitize, set in rich text editor
        var parser = new DOMParser();
        var doc = parser.parseFromString(text, 'text/html');
        var body = doc.body ? doc.body.innerHTML : text;
        // Sanitize using a simple allowlist
        var sanitized = sanitizeImportedHtml(body);
        richEl.innerHTML = sanitized;
        if (mdEl) mdEl.value = htmlToMarkdown(sanitized);
        A.notice(noticeEl, 'ok', 'HTML imported and sanitized. Review and edit before saving.');
      }

      /* Allowlist-based HTML sanitizer for imported documents.
         Only explicitly allowed tags and attributes survive. */
      var ALLOWED_IMPORT_TAGS = new Set([
        'h1','h2','h3','h4','h5','h6','p','br','hr',
        'strong','b','em','i','u','s','mark','small','sub','sup',
        'ul','ol','li','blockquote','pre','code',
        'a','img','span',
        'table','thead','tbody','tfoot','tr','th','td','caption'
      ]);
      var ALLOWED_IMPORT_ATTRS = {
        'a': ['href','title','target','rel'],
        'img': ['src','alt','width','height','loading'],
        'th': ['colspan','rowspan','scope'],
        'td': ['colspan','rowspan'],
        '*': ['class']
      };
      var SAFE_URL_RE = /^(https?:\/\/|mailto:|\/|#)/i;
      var DANGEROUS_PROTOCOL_RE = /^(javascript|data|vbscript|file):/i;

      function sanitizeImportedHtml(html) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        // Remove SVG and MathML entirely
        doc.querySelectorAll('svg, math, foreignObject').forEach(function (el) { el.remove(); });
        // Remove all elements not in allowlist (keep inner text)
        var allEls = Array.from(doc.body.querySelectorAll('*'));
        allEls.forEach(function (el) {
          var tag = el.tagName.toLowerCase();
          if (!ALLOWED_IMPORT_TAGS.has(tag)) {
            // Replace with text content
            var text = document.createTextNode(el.textContent || '');
            el.parentNode.replaceChild(text, el);
            return;
          }
          // Sanitize attributes
          var allowed = (ALLOWED_IMPORT_ATTRS[tag] || []).concat(ALLOWED_IMPORT_ATTRS['*']);
          Array.from(el.attributes).forEach(function (attr) {
            var name = attr.name.toLowerCase();
            if (!allowed.includes(name)) { el.removeAttribute(attr.name); return; }
            if (name.startsWith('on')) { el.removeAttribute(attr.name); return; }
            if (name === 'href' || name === 'src') {
              var val = attr.value.trim();
              if (DANGEROUS_PROTOCOL_RE.test(val) || !SAFE_URL_RE.test(val)) {
                el.removeAttribute(attr.name);
              }
            }
            if (name === 'target') {
              if (!/^_blank$/i.test(attr.value)) { el.removeAttribute(attr.name); }
              else { el.setAttribute('rel', 'noopener noreferrer'); }
            }
            if (name === 'loading' && !/^lazy$/i.test(attr.value)) {
              el.removeAttribute(attr.name);
            }
            if ((name === 'width' || name === 'height') && !/^\d{1,4}$/.test(attr.value)) {
              el.removeAttribute(attr.name);
            }
          });
        });
        return doc.body ? doc.body.innerHTML : '';
      }

      var CDN_INTEGRITY = {
        'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js': 'sha384-nFoSjZIoH3CCp8W639jJyQkuPHinJ2NHe7on1xvlUA7SuGfJAfvMldrsoAVm6ECz',
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js': 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e'
      };
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
          var s = document.createElement('script');
          s.src = src;
          s.crossOrigin = 'anonymous';
          if (CDN_INTEGRITY[src]) s.integrity = CDN_INTEGRITY[src];
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Failed to load ' + src)); };
          document.head.appendChild(s);
        });
      }

      function validateDocxStructure(ab){
        try{var b=new Uint8Array(ab);var e=-1;for(var i=b.length-22;i>=Math.max(0,b.length-65557);i--){if(b[i]===0x50&&b[i+1]===0x4B&&b[i+2]===0x05&&b[i+3]===0x06){e=i;break;}}
        if(e<0)return{valid:false,reason:"Not a valid ZIP archive."};
        var co=b[e+16]|(b[e+17]<<8)|(b[e+18]<<16)|(b[e+19]<<24);var cs=b[e+12]|(b[e+13]<<8)|(b[e+14]<<16)|(b[e+15]<<24);
        var en=new Set();var p2=co,end2=co+cs;
        while(p2<end2&&p2+46<=b.length){if(b[p2]!==0x50||b[p2+1]!==0x4B||b[p2+2]!==0x01||b[p2+3]!==0x02)break;var nl=b[p2+28]|(b[p2+29]<<8);var xl=b[p2+30]|(b[p2+31]<<8);var cl=b[p2+32]|(b[p2+33]<<8);var n="";for(var j=0;j<nl&&p2+46+j<b.length;j++)n+=String.fromCharCode(b[p2+46+j]);en.add(n);p2+=46+nl+xl+cl;}
        if(!en.has("word/document.xml"))return{valid:false,reason:"Missing word/document.xml - not a valid DOCX."};
        if(!en.has("[Content_Types].xml"))return{valid:false,reason:"Missing [Content_Types].xml - not a valid DOCX."};
        if(!en.has("_rels/.rels"))return{valid:false,reason:"Missing _rels/.rels - not a valid DOCX."};
        return{valid:true};}catch(ex){return{valid:false,reason:"Could not read DOCX structure: "+(ex&&ex.message||ex)};}}

      async function importDocx(file){
        A.notice(noticeEl,"ok","Validating DOCX...");
        var reader=new FileReader();
        reader.onload=async function(){
          var check=validateDocxStructure(reader.result);
          if(!check.valid){A.notice(noticeEl,"error",check.reason);return;}
          A.notice(noticeEl,"ok","Loading DOCX parser...");
          try{await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js");}
          catch(e){A.notice(noticeEl,"error","Could not load DOCX parser. Check your internet connection.");return;}
          try{var result=await window.mammoth.convertToHtml({arrayBuffer:reader.result});var html=result.value;
          if(!html||!html.trim()){A.notice(noticeEl,"error","No content could be extracted from the DOCX file.");return;}
          richEl.innerHTML=sanitizeImportedHtml(html);if(mdEl)mdEl.value=htmlToMarkdown(richEl.innerHTML);
          A.notice(noticeEl,"ok","DOCX imported. Review and edit before saving.");
          if(result.messages&&result.messages.length)console.warn("DOCX import messages:",result.messages);}
          catch(err){A.notice(noticeEl,"error","DOCX import failed: "+(err.message||err));}};
        reader.onerror=function(){A.notice(noticeEl,"error","Could not read the file.");};
        reader.readAsArrayBuffer(file);
      }

      async function importPdf(file) {
        A.notice(noticeEl, 'ok', 'Loading PDF parser...');
        try {
          await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
        } catch (e) {
          A.notice(noticeEl, 'error', 'Could not load PDF parser. Check your internet connection.');
          return;
        }
        if (window.pdfjsLib) {
          // SRI hash verified (sha384): sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2 (worker loaded via API, not script tag)
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
        var reader = new FileReader();
        reader.onload = async function () {
          try {
            var pdf = await window.pdfjsLib.getDocument({ data: reader.result }).promise;
            var textParts = [];
            for (var i = 1; i <= pdf.numPages; i++) {
              var page = await pdf.getPage(i);
              var content = await page.getTextContent();
              var pageText = content.items.map(function (item) { return item.str; }).join(' ');
              if (pageText.trim()) textParts.push(pageText);
            }
            var fullText = textParts.join('\n\n');
            if (!fullText.trim()) {
              A.notice(noticeEl, 'error', 'No selectable text found. This may be a scanned PDF requiring OCR.');
              return;
            }
            // Convert text to simple HTML paragraphs
            var paragraphs = fullText.split(/\n\n+/).map(function (p) {
              return '<p>' + A.esc(p.trim()) + '</p>';
            }).join('');
            richEl.innerHTML = paragraphs;
            if (mdEl) mdEl.value = htmlToMarkdown(paragraphs);
            A.notice(noticeEl, 'ok', 'PDF text extracted (' + pdf.numPages + ' pages). Review and edit before saving.');
          } catch (err) {
            A.notice(noticeEl, 'error', 'PDF import failed: ' + (err.message || err));
          }
        };
        reader.onerror = function () { A.notice(noticeEl, 'error', 'Could not read the file.'); };
        reader.readAsArrayBuffer(file);
      }

      function handleImport(file) {
        if (!file) return;
        var name = file.name.toLowerCase();
        var size = file.size;
        if (size > 10 * 1024 * 1024) {
          A.notice(noticeEl, 'error', 'File is too large (max 10 MB).');
          return;
        }
        if (size === 0) {
          A.notice(noticeEl, 'error', 'File is empty.');
          return;
        }
        // Validate file signature (magic bytes)
        var ext = name.split('.').pop();
        var reader = new FileReader();
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          var valid = true;
          if (ext === 'pdf') {
            // PDF signature: %PDF
            valid = bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46;
          } else if (ext === 'docx') {
            // ZIP signature: PK (0x50 0x4B)
            valid = bytes[0] === 0x50 && bytes[1] === 0x4B;
          } else if (ext === 'md' || ext === 'html' || ext === 'htm') {
            // Text files: check for null bytes (binary content)
            for (var i = 0; i < Math.min(bytes.length, 1024); i++) {
              if (bytes[i] === 0) { valid = false; break; }
            }
          }
          if (!valid) {
            A.notice(noticeEl, 'error', 'File signature does not match extension. The file may be corrupted or renamed.');
            return;
          }
          // Proceed with import
          proceedImport(file, ext);
        };
        reader.onerror = function () { A.notice(noticeEl, 'error', 'Could not read the file.'); };
        reader.readAsArrayBuffer(file.slice(0, 4));
        return;
      }

      function proceedImport(file, ext) {
        // Warn before replacing existing content
        if (richEl.innerHTML.trim() || (mdEl && mdEl.value.trim())) {
          if (!window.confirm('Importing will replace the current editor content. Continue?')) return;
        }
        if (ext === 'md') {
          var reader = new FileReader();
          reader.onload = function () { importMarkdown(reader.result); };
          reader.onerror = function () { A.notice(noticeEl, 'error', 'Could not read the file.'); };
          reader.readAsText(file);
        } else if (ext === 'html' || ext === 'htm') {
          var reader2 = new FileReader();
          reader2.onload = function () { importHtml(reader2.result); };
          reader2.onerror = function () { A.notice(noticeEl, 'error', 'Could not read the file.'); };
          reader2.readAsText(file);
        } else if (ext === 'docx') {
          importDocx(file);
        } else if (ext === 'pdf') {
          importPdf(file);
        } else {
          A.notice(noticeEl, 'error', 'Unsupported file type. Use .md, .html, .docx, or .pdf.');
        }
      }

      if (importBtn && importFile) {
        importBtn.addEventListener('click', function () { importFile.click(); });
        importFile.addEventListener('change', function () {
          if (importFile.files && importFile.files[0]) handleImport(importFile.files[0]);
          importFile.value = '';
        });
      }

      function updateSeo() {
        A.$('[data-seo-title]').textContent = titleEl.value || 'Article title';
        A.$('[data-seo-desc]').textContent = seoEl.value || excerptEl.value || 'Article description';
        A.$('[data-seo-url]').textContent = 'ahsolution.live/article/' + (slugEl.value || '…');
      }
      seoEl.addEventListener('input', updateSeo);
      excerptEl.addEventListener('input', updateSeo);

      /* ---------------- rich text toolbar ---------------- */
      A.$('[data-toolbar]').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        e.preventDefault();
        bodyEl.focus();

        if (btn.dataset.cmd === 'code') {
          document.execCommand('insertHTML', false, '<code>' + (getSelection().toString() || 'code') + '</code>');
          return;
        }
        if (btn.dataset.block) {
          document.execCommand('formatBlock', false, btn.dataset.block);
          return;
        }
        if (btn.hasAttribute('data-link')) {
          var url = window.prompt('Link URL (https://…)');
          if (url) {
            try {
              var parsed = new URL(url, location.href);
              if (!['http:', 'https:', 'mailto:'].includes(parsed.protocol)) throw new Error('scheme');
              document.execCommand('createLink', false, parsed.href);
            } catch (_) { A.notice(noticeEl, 'error', 'Enter a valid http, https, or mailto link.'); }
          }
          return;
        }
        if (btn.hasAttribute('data-image')) {
          var src = window.prompt('Image URL (https://…)');
          if (src) {
            try {
              var parsedImage = new URL(src, location.href);
              if (!['http:', 'https:'].includes(parsedImage.protocol)) throw new Error('scheme');
              document.execCommand('insertHTML', false, '<img src="' + A.esc(parsedImage.href) + '" alt="">');
            } catch (_) { A.notice(noticeEl, 'error', 'Enter a valid http or https image URL.'); }
          }
          return;
        }
        if (btn.dataset.cmd) document.execCommand(btn.dataset.cmd, false, null);
      });
      [titleEl, slugEl, bodyEl, excerptEl, tagsEl, seoEl, statusEl, coverUrlEl].forEach(function (el) {
        el.addEventListener('input', A.debounce(function () { saveLocal(); }, 800));
        el.addEventListener('change', A.debounce(function () { saveLocal(); }, 800));
      });

      /* ---------------- local safety copy ---------------- */
      var localKey = 'ah-admin-draft';
      function saveLocal() {
        try {
          localStorage.setItem(localKey, JSON.stringify({
            id: currentId, title: titleEl.value, slug: slugEl.value, body: bodyEl.innerHTML,
            excerpt: excerptEl.value, tags: tagsEl.value, seo_description: seoEl.value,
            category: category, status: statusEl.value, cover_image_url: coverUrlEl.value,
            at: Date.now()
          }));
        } catch (e) {}
      }
      function restoreLocal() {
        try {
          var d = JSON.parse(localStorage.getItem(localKey) || 'null');
          if (!d || d.id !== currentId || !d.body) return false;
          if (!bodyEl.innerHTML.trim() && window.confirm('Restore the locally saved draft from ' + new Date(d.at).toLocaleString() + '?')) {
            bodyEl.innerHTML = d.body;
            if (!titleEl.value) titleEl.value = d.title || '';
            if (!slugEl.value) slugEl.value = d.slug || '';
            if (!excerptEl.value) excerptEl.value = d.excerpt || '';
            if (!tagsEl.value) tagsEl.value = d.tags || '';
            if (!seoEl.value) seoEl.value = d.seo_description || '';
            if (d.category) setCategory(d.category);
            if (d.status) statusEl.value = d.status;
            if (!coverUrlEl.value && d.cover_image_url) setCover(d.cover_image_url);
            updateSeo();
            return true;
          }
        } catch (e) {}
        return false;
      }
      if (!currentId) setTimeout(restoreLocal, 400);

      /* ---------------- cover upload ---------------- */
      A.$('[data-cover-file]').addEventListener('change', function () {
        var f = this.files && this.files[0];
        if (!f) return;
        if (f.size > 3 * 1024 * 1024) { A.notice(noticeEl, 'error', 'Cover images must be 3 MB or smaller.'); this.value = ''; return; }
        A.notice(noticeEl, 'ok', 'Uploading cover…');
        A.uploadCover(f).then(function (res) {
          setCover(res.url);
          A.notice(noticeEl, 'ok', 'Cover uploaded.');
        }).catch(function (err) {
          A.notice(noticeEl, 'error', 'Upload failed: ' + err.message);
        });
      });
      A.$('[data-cover-upload]').addEventListener('click', function () {
        var f = A.$('[data-cover-file]').files && A.$('[data-cover-file]').files[0];
        if (!f) { A.notice(noticeEl, 'error', 'Choose an image file first.'); return; }
        A.$('[data-cover-file]').dispatchEvent(new Event('change'));
      });
      coverUrlEl.addEventListener('input', function () { setCover(coverUrlEl.value.trim()); });

      /* ---------------- save / publish ---------------- */
      function collect() {
        return {
          id: currentId || undefined,
          title: titleEl.value.trim(),
          slug: slugEl.value.trim(),
          excerpt: excerptEl.value.trim(),
          body: bodyEl.innerHTML,
          category: category,
          tags: tagsEl.value.trim(),
          cover_image_url: coverUrlEl.value.trim(),
          seo_description: seoEl.value.trim(),
          status: statusEl.value
        };
      }

      function save(targetStatus) {
        if (saving) return Promise.resolve();
        var data = collect();
        // SECURITY: never send status to create/update — server controls publication
        delete data.status;
        if (!data.title) { A.notice(noticeEl, 'error', 'A title is required.'); titleEl.focus(); return Promise.resolve(); }
        if (!bodyEl.textContent.trim() && !mdEl.value.trim()) { A.notice(noticeEl, 'error', 'The article body is empty.'); bodyEl.focus(); return Promise.resolve(); }

        saving = true;
        A.notice(noticeEl, 'ok', targetStatus === 'published' ? 'Saving draft�?�' : 'Saving�?�');

        var job = currentId ? A.articles.update(data) : A.articles.create(data);
        return job.then(function (res) {
          if (!res.body || !res.body.ok) throw new Error((res.body && res.body.error) || 'save_failed');
          var saved = res.body.article || {};
          currentId = saved.id || currentId;
          if (saved.slug) { slugEl.value = saved.slug; slugTouched = true; }
          if (saved.status) statusEl.value = saved.status;
          try { localStorage.removeItem('ah-admin-draft'); } catch (e) {}

          // If publishing, call dedicated publish action
          if (targetStatus === 'published' && currentId) {
            A.notice(noticeEl, 'ok', 'Publishing�?�');
            return A.articles.publish(currentId).then(function (pubRes) {
              saving = false;
              if (!pubRes.body || !pubRes.body.ok) throw new Error((pubRes.body && pubRes.body.error) || 'publish_failed');
              var pub = pubRes.body.article || {};
              if (pub.status) statusEl.value = pub.status;
              metaEl.textContent = 'Published just now A� ' + (pub.reading_minutes || 1) + ' min read';
              updateSeo();
              if (!id && currentId) history.replaceState(null, '', 'editor.html?id=' + encodeURIComponent(currentId));
              // Trigger build (fire-and-forget with status feedback)
              A.triggerBuild('publish', currentId).then(function (tr) {
                if (tr && tr.body && tr.body.ok) {
                  A.notice(noticeEl, 'ok', 'Published in database. Build request accepted (deployment pending).');
                } else {
                  A.notice(noticeEl, 'error', 'Published in database, but build trigger failed. Manual rebuild may be needed.');
                }
              }).catch(function () {
                A.notice(noticeEl, 'error', 'Published in database, but build trigger failed. Manual rebuild may be needed.');
              });
              return pubRes;
            });
          }

          saving = false;
          A.notice(noticeEl, 'ok', 'Draft saved.');
          metaEl.textContent = 'Saved just now A� ' + (saved.reading_minutes || 1) + ' min read';
          updateSeo();
          if (!id && currentId) history.replaceState(null, '', 'editor.html?id=' + encodeURIComponent(currentId));
          return res;
        }).catch(function (err) {
          saving = false;
          if (err.message === 'auth_required') { location.replace('login.html'); return; }
          var msg = err.message === 'slug_taken' ? 'That slug is already used by another article.'
            : err.message === 'invalid_slug' ? 'The slug may only contain lowercase letters, numbers and hyphens.'
            : 'Save failed: ' + err.message;
          A.notice(noticeEl, 'error', msg);
        });
      }

      A.$('[data-save-draft]').addEventListener('click', function () { save('draft'); });
      A.$('[data-publish]').addEventListener('click', function () { save('published'); });

      // Warn about unsaved changes
      var dirty = false;
      [titleEl, slugEl, bodyEl, excerptEl, tagsEl, seoEl, statusEl, coverUrlEl, mdEl].forEach(function (el) {
        if (el) el.addEventListener('input', function () { dirty = true; });
      });
      window.addEventListener('beforeunload', function (e) {
        if (dirty && !saving) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
      form.addEventListener('submit', function (e) { e.preventDefault(); save(statusEl.value); });
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(statusEl.value); }
      });

      updateSeo();
    })();
  </script>
</body>
</html>
